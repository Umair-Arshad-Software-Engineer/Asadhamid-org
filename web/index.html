  <script>
    // Base64 -> Blob helper
    function b64ToBlob(b64, type) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: type });
    }

    // Copies a PNG to the clipboard.
    // Needs https or localhost, and must be called inside a user tap.
    window.copyPngToClipboard = async function (b64) {
      try {
        const blob = b64ToBlob(b64, 'image/png');
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        return true;
      } catch (e) {
        console.error('copyPngToClipboard failed', e);
        return false;
      }
    };

    // Opens the native share sheet with the image AND the text together.
    // Returns false if the browser/OS doesn't support file sharing.
    window.sharePngWithText = async function (b64, text, fileName) {
      try {
        const file = new File([b64ToBlob(b64, 'image/png')], fileName, { type: 'image/png' });
        if (!navigator.canShare || !navigator.canShare({ files: [file] })) return false;
        await navigator.share({ files: [file], text: text });
        return true;
      } catch (e) {
        console.error('sharePngWithText failed', e);
        return false;
      }
    };
  </script>
